name: Publicar aplicación en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar herramientas de prueba
        run: npm ci
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check markets.js
          node --check server.js
          node --check card-model.js
          node --check card-renderer.js
          npm test
      - name: Localizar el navegador instalado
        id: browser
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if browser_path="$(command -v "$candidate")"; then
              "$browser_path" --version
              echo "executable=$browser_path" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No se encontró Chrome o Chromium en el runner."
          exit 1
      - name: Comparar tarjetas con el diseño original
        timeout-minutes: 5
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ steps.browser.outputs.executable }}
        run: npm run test:browser
      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html styles.css app.js markets.js card-model.js card-renderer.js _site/
          cp -R assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
